<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR Mangrove Conservation Orgs</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Puerto Rico Mangrove Conservation Organizations</h1>
    <h2>Map of Grassroots Environmental Organizations in Puerto Rico </h2>

    <div id="map" style="height: 500px;"></div>
    <script>
    // Center on Puerto Rico (approximate center coordinates)
    var map = L.map('map').setView([18.2, -66.4], 9);

    // Add the OpenStreetMap tile layer
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    //CRES PR Location Marker
    L.marker([18.4508,-66.0579]).addTo(map)
        .bindPopup('<b>Cres PR</b><br>Mangrove Nursery and Conservation');
    </script>
    
    <h3>List of Organizations</h3>
    <h4>Northeastern Region</h4>
    <ul>
        <li>CRES PR - <a href="https://www.crespr.org/en">Website Link</a> - San Juan, PR</li>
    </ul>
    <h4>Northwestern Region</h4>
    <ul>
        <li>placeholder</li>
    </ul>
    

</body>
</html>
